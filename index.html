    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        :root {
            --bg: #080810;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --text: #f0f0f8;
            --muted: rgba(240,240,248,0.4);
            --accent: #7c6cff;
            --accent-dim: rgba(124, 108, 255, 0.15);
            --blue: #3b82f6;
            --blue-dim: rgba(59,130,246,0.12);
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4rem 1.25rem 3rem;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Canvas bg ── */
        canvas#bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        /* ── Noise overlay ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.6;
        }

        /* ── Main container ── */
        .wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        .avatar-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.25rem;
            position: relative;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), #60a5fa, #a78bfa, var(--accent));
            animation: spin 6s linear infinite;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--bg);
            border-radius: 50%;
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('avatar.jpg') center/cover, linear-gradient(135deg, #1a1a2e, #16213e);
            background-size: cover;
        }

        .name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
        }

        .bio {
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ── Tags row ── */
        .tags {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        /* ── Links ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.9rem 1.1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            position: relative;
            overflow: hidden;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .card:active { transform: translateY(0); }

        /* Staggered animation delays */
        .card:nth-child(1) { animation-delay: 0.08s; }
        .card:nth-child(2) { animation-delay: 0.14s; }
        .card:nth-child(3) { animation-delay: 0.20s; }
        .card:nth-child(4) { animation-delay: 0.26s; }
        .card:nth-child(5) { animation-delay: 0.32s; }
        .card:nth-child(6) { animation-delay: 0.38s; }

        /* Shimmer on hover */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            transition: left 0.5s;
        }
        .card:hover::before { left: 100%; }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .card:hover .icon-box {
            background: rgba(255,255,255,0.09);
        }

        .icon-box svg {
            width: 18px;
            height: 18px;
            stroke: rgba(255,255,255,0.7);
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-body { flex: 1; min-width: 0; }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 400;
            margin-top: 0.1rem;
            font-family: 'Space Mono', monospace;
        }

        .arrow {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
        }
        .card:hover .arrow { opacity: 0.7; transform: translateX(3px); }

        /* ── VPN special card ── */
        .card-vpn {
            background: var(--blue-dim);
            border-color: rgba(59,130,246,0.3);
        }
        .card-vpn:hover {
            background: rgba(59,130,246,0.18);
            border-color: rgba(59,130,246,0.55);
            box-shadow: 0 0 28px rgba(59,130,246,0.18);
        }
        .card-vpn .icon-box {
            background: rgba(59,130,246,0.15);
            border-color: rgba(59,130,246,0.3);
        }
        .card-vpn .icon-box svg { stroke: #60a5fa; }

        .badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;

            padding: 0.15rem 0.45rem;
            border-radius: 4px;

            color: #93c5fd;
            border: 1px solid rgba(59,130,246,0.35);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-right: 0.25rem;
        }

        /* ── Section label ── */
        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            text-transform: uppercase;
            margin: 1.5rem 0 0.6rem 0.25rem;
            opacity: 0.6;
        }

        /* ── Footer ── */
        footer {
            margin-top: 2.5rem;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0.5;
            letter-spacing: 0.05em;
            animation: rise 0.7s 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        /* ── Animations ── */
        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            body { padding: 2.5rem 1rem 2rem; }
            .name { font-size: 1.75rem; }
        }
    </style>

<script>
// ── Animated background: floating orbs ──────────────────────
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const orbs = Array.from({ length: 5 }, (_, i) => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: 180 + Math.random() * 220,
    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.25,
    color: i % 2 === 0
        ? `rgba(124,108,255,${0.06 + Math.random() * 0.06})`
        : `rgba(59,130,246,${0.05 + Math.random() * 0.05})`
}));

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    orbs.forEach(o => {
        o.x += o.vx; o.y += o.vy;
        if (o.x < -o.r) o.x = canvas.width + o.r;
        if (o.x > canvas.width + o.r) o.x = -o.r;
        if (o.y < -o.r) o.y = canvas.height + o.r;
        if (o.y > canvas.height + o.r) o.y = -o.r;
        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
        g.addColorStop(0, o.color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(draw);
}
draw();

// ── Cursor trail on cards ────────────────────────────────────
document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mx', x + '%');
        card.style.setProperty('--my', y + '%');
    });
});
</script>
